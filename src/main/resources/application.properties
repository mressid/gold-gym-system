spring.application.name=Master-GYM

server.port=8089

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/MasterGYM?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:ali}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.security=DEBUG

#images size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# JWT Secret Key
jwt.secret=${JWT_SECRET:87tQD9ObeVfuhLDBH9KWNDGsryrVhVgdN95bIkikZYJ8QHC4DTASNhRxzCHKWrv+xFUguzsNO3hXC9BFkJqmvg==}

# MinIO
minio.url=${MINIO_URL:http://localhost:9020}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9020}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:master-gym}

app.default-avatar-key=defaults/avatar.svg

# Seeded default admin account (created once on first startup if no user with this email exists)
app.admin.display-name=${ADMIN_DISPLAY_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.telephone=${ADMIN_TELEPHONE:22865991}
app.admin.password=${ADMIN_PASSWORD:ali1234}